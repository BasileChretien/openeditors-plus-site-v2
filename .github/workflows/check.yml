name: Check site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: node --test scripts/check-figures.test.mjs

      # Fails on a dataset figure typed into src/ instead of read from public/api/.
      - run: node scripts/check-figures.mjs

      # The pages assert that the release notes and the download history cover
      # the release in public/api/release_meta.json; a build proves they do.
      - run: npx astro build
